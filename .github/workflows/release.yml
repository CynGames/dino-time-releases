name: Publicar versión de Dino Time

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión nueva (semver, por ejemplo 1.0.1)
        required: true
        type: string
      release_notes:
        description: Novedades (las primeras líneas se muestran en la app después de actualizar)
        required: false
        type: string
      ref:
        description: Rama o commit del código fuente
        required: false
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: dino-time-release
  cancel-in-progress: false

jobs:
  release:
    name: Probar, compilar, firmar y publicar
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
        shell: pwsh
    env:
      RELEASE_REPOSITORY: ${{ github.repository }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Descargar el código privado (solo lectura)
        uses: actions/checkout@v4
        with:
          repository: CynGames/dino-time
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: source

      - name: Validar versión y secretos
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'La versión tiene que ser semver: 1.2.3' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) { throw 'Falta el secreto TAURI_SIGNING_PRIVATE_KEY.' }
          gh release view "v$env:VERSION" --repo $env:RELEASE_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "La versión v$env:VERSION ya existe." }
          $global:LASTEXITCODE = 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri

      - name: Poner la versión
        run: |
          @{ version = $env:VERSION } | ConvertTo-Json | Set-Content src-tauri/version.conf.json -Encoding utf8NoBOM
          (Get-Content src-tauri/Cargo.toml -Raw) -replace '(?m)^version = ".*"', "version = `"$env:VERSION`"" | Set-Content src-tauri/Cargo.toml -Encoding utf8NoBOM -NoNewline
          npm version $env:VERSION --no-git-tag-version --allow-same-version

      - name: Instalar dependencias
        run: npm ci

      - name: Tests del motor y de los datos
        working-directory: source/src-tauri
        run: cargo test

      - name: Compilar y firmar
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config src-tauri/version.conf.json

      - name: Preparar instalador y latest.json
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem $dir -Filter "*_$($env:VERSION)_x64-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw 'No se generó el instalador NSIS.' }
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) { throw 'No se generó la firma del instalador.' }
          $asset = "DinoTime_$($env:VERSION)_x64-setup.exe"
          New-Item -ItemType Directory -Force ../out | Out-Null
          Copy-Item $exe.FullName "../out/$asset"
          $notes = if ([string]::IsNullOrWhiteSpace($env:NOTES)) { "Dino Time v$env:VERSION" } else { $env:NOTES }
          $manifest = [ordered]@{
            version   = $env:VERSION
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $sig -Raw).Trim()
                url       = "https://github.com/$env:RELEASE_REPOSITORY/releases/download/v$env:VERSION/$asset"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content ../out/latest.json -Encoding utf8NoBOM
          Get-Content ../out/latest.json

      - name: Publicar release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          $notes = if ([string]::IsNullOrWhiteSpace($env:NOTES)) { "Dino Time v$env:VERSION" } else { $env:NOTES }
          gh release create "v$env:VERSION" "DinoTime_$($env:VERSION)_x64-setup.exe" latest.json `
            --repo $env:RELEASE_REPOSITORY --title "Dino Time v$env:VERSION" --notes $notes --latest
